<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  :root { --card: #1C1C1E; --text: #F2F2F7; --text2: #8E8E93; --line: rgba(255,255,255,.09); --hover: rgba(127,127,127,.18);
    --danger: #FF453A; --accent: #4DA3FF; --track: #3A3A3C; --on: #F2F2F7; --knob: #1C1C1E; --bg: #1C1C1E; }
  body.light { --card: #FFFFFF; --text: #111113; --text2: #6C6C70; --line: rgba(0,0,0,.08); --hover: rgba(127,127,127,.14);
    --danger: #D70015; --accent: #0063CC; --track: #D1D1D6; --on: #111113; --knob: #FFFFFF; --bg: #FFFFFF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 13.5px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #panel { position: fixed; right: 8px; width: 336px; background: var(--card); border-radius: 16px; padding: 6px 0;
    box-shadow: 0 10px 34px rgba(0,0,0,.5), 0 0 0 1px var(--line); overflow-y: auto; display: none; outline: 0;
    transform-origin: top right; animation: pop .14s ease-out; }
  body.light #panel { box-shadow: 0 10px 30px rgba(0,0,0,.16), 0 0 0 1px var(--line); }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  #panel::-webkit-scrollbar { width: 0; }
  .it { display: flex; align-items: center; gap: 12px; width: calc(100% - 12px); margin: 0 6px; min-height: 38px;
    padding: 0 10px; border: 0; border-radius: 10px; background: none; color: inherit; font: inherit; text-align: left; outline: 0; }
  .it:hover, .it:focus-visible { background: var(--hover); }
  .it .ic { width: 19px; height: 19px; flex: none; display: grid; place-items: center; }
  .it .ic svg { width: 19px; height: 19px; }
  .it .lb { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .ac { color: var(--text2); font-size: 12px; flex: none; }
  .it .ch { width: 16px; height: 16px; flex: none; color: var(--text2); transition: transform .15s; }
  .it .ch svg { width: 16px; height: 16px; }
  .it.open .ch { transform: rotate(90deg); }
  .it.danger { color: var(--danger); }
  .it.accent { color: var(--accent); }
  .sep { height: 1px; background: var(--line); margin: 6px 14px; }
  .sub { display: none; padding: 0 0 4px; }
  .sub.open { display: block; }
  .sub .it { min-height: 34px; padding-left: 41px; }
  .sub .it .ic { width: 16px; height: 16px; }
  .sub .it .ic svg { width: 16px; height: 16px; }
  .sub .it.accent, .sub .it.danger { color: inherit; }
  .row { position: relative; }
  .tr { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 8px;
    background: none; color: var(--text2); display: grid; place-items: center; padding: 0; outline: 0; }
  .tr svg { width: 16px; height: 16px; }
  .tr:hover, .tr:focus-visible { background: var(--hover); color: var(--danger); }
  .sw { min-height: 52px; }
  .sw .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; white-space: nowrap; }
  .sw .tx > span { overflow: hidden; text-overflow: ellipsis; }
  .sw .tx small { color: var(--text2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .tg { width: 36px; height: 21px; border-radius: 11px; background: var(--track); position: relative; flex: none; transition: background .15s; }
  .tg::after { content: ""; position: absolute; left: 2px; top: 2px; width: 17px; height: 17px; border-radius: 50%; background: var(--knob);
    box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
  body:not(.light) .tg::after { background: #8E8E93; }
  .tg.on { background: var(--on); }
  .tg.on::after, body:not(.light) .tg.on::after { left: 17px; background: var(--knob); }
  .hd { color: var(--text2); font-size: 11.5px; padding: 6px 16px 2px; }
</style>
</head>
<body>
<div id="panel" role="menu" tabindex="-1"></div>
<script src="icons.js"></script>
<script src="menu.js"></script>
</body>
</html>
