<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Скачанные файлы</title>
<link rel="icon" href="byss://shared/byss.png">
<link rel="stylesheet" href="byss://shared/common.css">

<body>
<div id="wrap">
  <header>
    <h1>Скачанные файлы</h1>
    <div class="tools">
      <input class="field" id="q" placeholder="Найти по имени или сайту" spellcheck="false">
      <button class="btn" id="dir">Открыть папку «Загрузки»</button>
      <button class="btn" id="clear">Очистить список</button>
    </div>
  </header>
  <div id="list"></div>
  <p class="note">Список хранится только в браузере. «Убрать из списка» и «Очистить список» не удаляют сами файлы.
    Загрузки из режимов BySS видны здесь до закрытия браузера.</p>
</div>
