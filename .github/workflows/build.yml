name: Собрать BySS для ПК

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.c.outputs.sha }}
      app: ${{ steps.c.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Применить исходники (если пришли)
        id: c
        run: |
          changed=0
          if [ -f update.b64 ]; then
            base64 -d update.b64 | xz -dc > /tmp/u.patch
            git apply --whitespace=nowarn /tmp/u.patch
            rm -f update.b64
            changed=1
          fi
          if [ -f update-remove.txt ]; then
            while read -r f; do [ -n "$f" ] && rm -rf -- "$f"; done < update-remove.txt
            rm -f update-remove.txt
            changed=1
          fi
          if [ "$changed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email ""
            git add -A
            git commit -m "Обновление исходников" || true
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f ext/manifest.json ]; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: prepare
    if: needs.prepare.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Собрать расширение и установщик
        run: |
          set -o pipefail
          bash installer/build.sh "2.0.${{ github.run_number }}" "${{ github.repository }}" 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
      - name: Журнал ошибок (если сборка упала)
        if: failure()
        run: |
          cp build.log /tmp/build-log.txt 2>/dev/null || echo "нет журнала" > /tmp/build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email ""
          git checkout --orphan logs
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp /tmp/build-log.txt build-log.txt
          git add build-log.txt
          git commit -m "Журнал сборки ${{ github.run_number }}"
          git push -f origin logs

  test:
    needs: [prepare, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out
      - name: Поставить BySS на чистую Windows и снять экран
        shell: pwsh
        run: ./installer/ci-test.ps1
      - name: Снимки — в ветку test-shots
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/shots && cp -r shots/. /tmp/shots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email ""
          git checkout --orphan test-shots
          git rm -rf --cached . > /dev/null 2>&1 || true
          git clean -fdx > /dev/null 2>&1 || true
          cp -r /tmp/shots/. .
          git add -A
          git commit -m "Проверка ${{ github.run_number }}" || true
          git push -f origin test-shots

  release:
    needs: [prepare, build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out
      - name: Опубликовать
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="2.0.${{ github.run_number }}"
          gh release create "v$V" out/BySS-Setup.exe out/latest.yml out/byss.xpi out/updates.json out/byss.json \
            --repo "${{ github.repository }}" --target "${{ needs.prepare.outputs.sha }}" --latest \
            --title "BySS $V" \
            --notes "BySS для Windows на Firefox ESR. Установка: скачайте BySS-Setup.exe и запустите. Из старого BySS: меню ⋮ → «Обновить браузер»."
