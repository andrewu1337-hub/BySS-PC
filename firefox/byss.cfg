// BySS — окна браузера (первая строка должна быть комментарием — так требует Firefox)
// 1) Значок окна BySS: его Windows показывает в подсказке при наведении на кнопку на панели задач.
// 2) Сердечко на «+» новой вкладки: появляется ровно там, где нажали, и не уезжает вместе с кнопкой.
try {
  (function () {
    const dirs = Cc['@mozilla.org/file/directory_service;1'].getService(Ci.nsIProperties);
    const ico = dirs.get('XREExeF', Ci.nsIFile).parent.parent; // папка BySS
    ico.append('byss.ico');
    let icon = null;

    function loadIcon() {
      if (icon !== null) return icon;
      icon = false;
      try {
        if (!ico.exists()) return icon;
        const s = Cc['@mozilla.org/network/file-input-stream;1'].createInstance(Ci.nsIFileInputStream);
        s.init(ico, -1, 0, 0);
        const bs = Cc['@mozilla.org/binaryinputstream;1'].createInstance(Ci.nsIBinaryInputStream);
        bs.setInputStream(s);
        const bytes = new Uint8Array(bs.readByteArray(bs.available()));
        s.close();
        const tools = Cc['@mozilla.org/image/tools;1'].getService(Ci.imgITools);
        icon = tools.decodeImageFromArrayBuffer(bytes.buffer, 'image/x-icon');
      } catch (e) {
        icon = false;
      }
      return icon;
    }

    function setIcon(win) {
      try {
        const img = loadIcon();
        if (!img) return;
        const ui = Cc['@mozilla.org/windows-ui-utils;1'].getService(Ci.nsIWindowsUIUtils);
        ui.setWindowIcon(win, img, img);
      } catch (e) {
        // не Windows или старая версия — останется обычный значок
      }
    }

    const HEART = 'url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E'
      + '%3Cpath fill=%27%23FF375F%27 d=%27M12,21.5 C12,21.5 2,14.6 2,8.4 C2,4.8 4.8,2.8 7.4,2.8 C9.6,2.8 11.2,4.1 12,5.6 '
      + 'C12.8,4.1 14.4,2.8 16.6,2.8 C19.2,2.8 22,4.8 22,8.4 C22,14.6 12,21.5 12,21.5 Z%27/%3E%3C/svg%3E")';

    function heart(win, btn) {
      try {
        const doc = win.document;
        const r = btn.getBoundingClientRect();
        const size = 20;
        const d = doc.createElementNS('http://www.w3.org/1999/xhtml', 'div');
        d.style.cssText = 'position:fixed;pointer-events:none;z-index:2147483647;'
          + 'left:' + (r.left + r.width / 2 - size / 2) + 'px;top:' + (r.top + r.height / 2 - size / 2) + 'px;'
          + 'width:' + size + 'px;height:' + size + 'px;background:' + HEART + ' center / contain no-repeat;';
        (doc.body || doc.documentElement).appendChild(d);
        const a = d.animate([
          { transform: 'scale(0.4)', opacity: 0 },
          { transform: 'scale(1.2)', opacity: 1, offset: 0.22 },
          { transform: 'translateY(-16px) scale(1)', opacity: 0 }
        ], { duration: 750, easing: 'cubic-bezier(.2,.8,.3,1)' });
        a.onfinish = () => d.remove();
        win.setTimeout(() => d.remove(), 1500);
      } catch (e) {
        // без сердечка
      }
    }

    function hook(win) {
      setIcon(win);
      win.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        const t = e.target;
        const b = t && t.closest ? t.closest('#tabs-newtab-button, #new-tab-button') : null;
        if (b) heart(win, b);
      }, true);
    }

    const obs = Cc['@mozilla.org/observer-service;1'].getService(Ci.nsIObserverService);
    obs.addObserver({ observe: (win) => hook(win) }, 'browser-delayed-startup-finished');
  })();
} catch (e) {
  // настройка окон не удалась — браузер работает как обычно
}
