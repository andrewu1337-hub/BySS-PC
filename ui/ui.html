<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: crx:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="strip">
  <div id="tabs"></div>
  <button id="plus" class="ib" title="Новая вкладка (Ctrl+T)"></button>
  <div id="drag"></div>
</div>
<div id="bar">
  <button id="back" class="ib" title="Назад (Alt+←)"></button>
  <button id="fwd" class="ib" title="Вперёд (Alt+→)"></button>
  <button id="reload" class="ib" title="Обновить (F5)"></button>
  <div id="pill">
    <button id="eng" class="ib small" title="Поисковик для адресной строки"><span id="engG">G</span></button>
    <button id="shield" class="ib small" title="Реклама и трекеры"><span id="count"></span></button>
    <input id="addr" spellcheck="false" autocomplete="off" placeholder="Поиск или адрес">
    <button id="pas" class="ib small pa on" title="Остановить автоскролл"></button>
    <button id="pfind" class="ib small pa" title="Найти на странице (Ctrl+F)"></button>
    <button id="pcopy" class="ib small pa" title="Скопировать ссылку"></button>
    <button id="pprint" class="ib small pa" title="Печать (Ctrl+P)"></button>
  </div>
  <button id="tr" class="ib" title="Перевести страницу"></button>
  <div id="exts"></div>
  <button id="menu" class="ib" title="Меню"></button>
</div>
<div id="find" hidden>
  <input id="fq" spellcheck="false" placeholder="Найти на странице">
  <span id="fcount"></span>
  <button id="fup" class="ib small" title="Предыдущее"></button>
  <button id="fdown" class="ib small" title="Следующее"></button>
  <button id="fclose" class="ib small" title="Закрыть (Esc)"></button>
</div>
<script src="icons.js"></script>
<script src="ui.js"></script>
</body>
</html>
